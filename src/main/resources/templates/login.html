<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />

    <title>Tela de Login</title>
  </head>
  <body>
    <!-- <div class="login-image-logo-container">
      <img
        th:src="@{/images/7465FC35-1D88-44AA-A162-04D4B5F20D7D.gif}"
        alt="Logo PUC Minas"
      />
    </div> -->
    <div class="login-form">
      <form th:action="@{/login}" method="post" class="login-form">
        <h1 class="login-title">Login</h1>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Username"
          required
        />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Senha"
          required
        />
        <div class="login-button-container">
          <button class="submit-btn" type="submit">Entrar</button>
        </div>
        <p class="login-redirect-options">
          Ainda não tem cadastro? <br />
          <a href="/register">Cadastre-se</a> |
          <a href="/recoverpassword">Esqueceu sua senha?</a>
        </p>
      </form>
    </div>
  </body>
</html>
